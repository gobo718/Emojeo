# Convenience root config. The canonical Worker config remains worker/wrangler.toml.
name = "genreactrix-ai"
main = "worker/src/index.js"
compatibility_date = "2026-07-01"

[ai]
binding = "AI"

[vars]
WORKERS_AI_VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
GENREACTRIX_FALLBACK_MODEL = "openai/gpt-4.1-mini"
GENREACTRIX_AI_GATEWAY_ID = "default"
# Durable server-side AI job runner. D1 and R2 are auto-provisionable by current Wrangler.
[[d1_databases]]
binding = "GENREACTRIX_JOBS_DB"

[[r2_buckets]]
binding = "GENREACTRIX_AI_IMAGES"

[[queues.producers]]
binding = "GENREACTRIX_AI_JOB_QUEUE"
queue = "genreactrix-ai-jobs"

[[queues.consumers]]
queue = "genreactrix-ai-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1

